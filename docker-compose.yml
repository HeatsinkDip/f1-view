version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ALLOWED_ORIGINS=http://localhost:3000
      - FASTF1_CACHE_DIR=/app/cache
    volumes:
      - fastf1-cache:/app/cache
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fastf1-cache:
